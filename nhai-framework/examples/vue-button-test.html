<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Vue Button 测试</title>
  <style>
    body {
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    #container {
      margin: 20px 0;
      padding: 20px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <h1>Vue + Element Plus Button 测试</h1>
  <div id="container"></div>
  
  <script type="module">
    console.log('开始测试...')
    
    // 检查导入是否成功
    try {
      const { createApp, h } = await import('https://cdn.jsdelivr.net/npm/vue@3/dist/vue.esm-browser.js')
      console.log('✅ Vue 3 加载成功')
      
      const { ElButton } = await import('https://cdn.jsdelivr.net/npm/element-plus/dist/index.esm.js')
      console.log('✅ Element Plus 加载成功')
      
      // 测试直接使用 Vue + Element Plus
      const testContainer = document.getElementById('container')
      
      const app = createApp({
        setup() {
          return () => h(ElButton, {
            type: 'primary',
            size: 'large'
          }, {
            default: () => '这是一个 Element Plus 按钮'
          })
        }
      })
      
      app.mount(testContainer)
      console.log('✅ 按钮渲染成功')
    } catch (error) {
      console.error('❌ 错误:', error)
    }
  </script>
</body>
</html>
