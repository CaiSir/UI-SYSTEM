<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas + Three.js 集成示例</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    
    .info {
      margin-bottom: 20px;
      padding: 15px;
      background: #e3f2fd;
      border-left: 4px solid #1976d2;
      border-radius: 4px;
      font-size: 14px;
      color: #333;
    }
    
    .canvas-container {
      border: 2px solid #ddd;
      border-radius: 4px;
      overflow: hidden;
      background: #000;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 Canvas + Three.js 集成示例</h1>
    
    <div class="info">
      <strong>💡 说明：</strong>
      Canvas组件提供基础的Canvas元素和WebGL上下文，<br>
      而3D渲染的摄像机、场景、几何体等应由应用层的Three.js等库管理。<br>
      这种分层设计保持了职责的清晰分离。
    </div>

    <div class="canvas-container">
      <div id="canvas-container" style="width: 100%; height: 600px; position: relative;"></div>
    </div>
  </div>

  <!-- 从CDN加载Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  
  <script type="module">
    import { 
      MaterialCanvas, 
      CanvasMode,
      NHAIFrameworkRegistry,
      VanillaAdapter 
    } from '../dist/index.js'

    // 初始化框架
    NHAIFrameworkRegistry.register('vanilla', new VanillaAdapter())
    NHAIFrameworkRegistry.use('vanilla')

    // 创建3D Canvas
    const canvas = new MaterialCanvas()
    canvas.setMode(CanvasMode['3D'])
    canvas.setCanvasSize(1200, 600)
    canvas.setWidth('100%')
    canvas.setHeight(600)

    // 渲染Canvas到容器
    const container = document.getElementById('canvas-container')
    const element = canvas.render()
    container.appendChild(element)

    // 获取Canvas元素和WebGL上下文
    const canvasElement = canvas.getCanvasElement()
    const gl = canvas.getContext3D()

    if (canvasElement && gl && typeof THREE !== 'undefined') {
      // 使用Three.js创建场景
      const scene = new THREE.Scene()
      scene.background = new THREE.Color(0x1a1a2e)
      
      // 创建透视摄像机（由Three.js管理）
      const camera = new THREE.PerspectiveCamera(75, canvasElement.width / canvasElement.height, 0.1, 1000)
      camera.position.z = 5
      
      // 创建渲染器，使用我们的Canvas
      const renderer = new THREE.WebGLRenderer({ 
        canvas: canvasElement,
        antialias: true 
      })
      renderer.setSize(canvasElement.width, canvasElement.height)
      
      // 添加一些几何体
      const boxGeometry = new THREE.BoxGeometry()
      const boxMaterial = new THREE.MeshPhongMaterial({ color: 0x1976d2 })
      const cube = new THREE.Mesh(boxGeometry, boxMaterial)
      scene.add(cube)
      
      // 添加光源
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5)
      scene.add(ambientLight)
      
      const pointLight = new THREE.PointLight(0xffffff, 1)
      pointLight.position.set(5, 5, 5)
      scene.add(pointLight)
      
      // 添加轨道控制器
      let isDragging = false
      let previousMousePosition = { x: 0, y: 0 }
      
      canvasElement.addEventListener('mousedown', (e) => {
        isDragging = true
        previousMousePosition = { x: e.clientX, y: e.clientY }
      })
      
      canvasElement.addEventListener('mousemove', (e) => {
        if (isDragging) {
          const deltaX = e.clientX - previousMousePosition.x
          const deltaY = e.clientY - previousMousePosition.y
          
          camera.position.x += deltaX * 0.01
          camera.position.y -= deltaY * 0.01
          camera.lookAt(0, 0, 0)
          
          previousMousePosition = { x: e.clientX, y: e.clientY }
        }
      })
      
      canvasElement.addEventListener('mouseup', () => {
        isDragging = false
      })
      
      // 动画循环
      function animate() {
        requestAnimationFrame(animate)
        
        cube.rotation.x += 0.01
        cube.rotation.y += 0.01
        
        renderer.render(scene, camera)
      }
      
      animate()
      
      console.log('✅ Three.js场景已创建')
      console.log('摄像机位置:', camera.position)
      console.log('摄像机类型:', camera.type) // PerspectiveCamera
    } else {
      console.error('❌ 无法初始化Three.js场景')
    }
  </script>
</body>
</html>
