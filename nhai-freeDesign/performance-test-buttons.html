<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHAI FreeDesign - 按钮性能测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #48bb78;
            color: white;
        }

        .btn-secondary:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover {
            background: #e53e3e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 101, 101, 0.4);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 25px;
            border-radius: 12px;
            border-left: 5px solid #667eea;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-card .unit {
            font-size: 14px;
            color: #999;
        }

        .progress-section {
            margin-bottom: 30px;
        }

        .progress-bar {
            background: #e0e0e0;
            border-radius: 10px;
            height: 40px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .buttons-container {
            background: #f5f7fa;
            border-radius: 12px;
            padding: 20px;
            max-height: 600px;
            overflow-y: auto;
            border: 2px dashed #ddd;
        }

        .button-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .button-item {
            display: inline-block;
        }

        .info-box {
            background: #fff3cd;
            border: 2px solid #ffeaa7;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .info-box h3 {
            color: #856404;
            margin-bottom: 10px;
        }

        .info-box p {
            color: #856404;
            line-height: 1.6;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }

        .status-running {
            background: #ffeaa7;
            color: #856404;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        .comparison-table th,
        .comparison-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .comparison-table th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }

        .comparison-table tr:hover {
            background: #f5f7fa;
        }

        .metric-good {
            color: #48bb78;
            font-weight: bold;
        }

        .metric-medium {
            color: #ed8936;
            font-weight: bold;
        }

        .metric-bad {
            color: #f56565;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 NHAI FreeDesign - 按钮性能测试</h1>
            <p>MaterialButton API 性能测试 - 渲染 10000 个按钮</p>
        </div>

        <div class="content">
            <div class="info-box">
                <h3>📊 测试说明</h3>
                <p><strong>目标：</strong>使用 MaterialButton 命令式 API 创建并渲染 10000 个按钮</p>
                <p><strong>测试指标：</strong>渲染时间、DOM 节点数、内存占用</p>
                <p><strong>技术：</strong>原生 DOM 操作 + Materialize CSS 样式</p>
            </div>

            <div class="controls">
                <button class="btn btn-primary" onclick="runTest()">开始性能测试</button>
                <button class="btn btn-secondary" onclick="clearResults()">清除结果</button>
                <button class="btn btn-danger" onclick="runLightweightComparison()">✨ 对比轻量级版本</button>
            </div>

            <div id="status" style="margin-bottom: 20px;"></div>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3>渲染时间</h3>
                    <div class="value" id="renderTime">-</div>
                    <div class="unit">毫秒</div>
                </div>
                <div class="stat-card">
                    <h3>按钮数量</h3>
                    <div class="value" id="buttonCount">0</div>
                    <div class="unit">个按钮</div>
                </div>
                <div class="stat-card">
                    <h3>DOM 节点数</h3>
                    <div class="value" id="domNodes">0</div>
                    <div class="unit">个节点</div>
                </div>
                <div class="stat-card">
                    <h3>内存占用</h3>
                    <div class="value" id="memory">-</div>
                    <div class="unit">MB</div>
                </div>
            </div>

            <div class="progress-section">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress" style="width: 0%;">0%</div>
                </div>
            </div>

            <h2 style="margin: 30px 0 15px 0;">按钮预览</h2>
            <div class="buttons-container" id="buttonsContainer"></div>

            <div id="resultsTable" style="margin-top: 30px;"></div>
        </div>
    </div>

    <script type="module">
        import { MaterialButton, ButtonType, ButtonColor, ButtonSize, VanillaAdapter, NHAIFrameworkRegistry } from 'nhai-framework'

        // 注册 Vanilla 适配器（必需！）
        const adapter = new VanillaAdapter()
        NHAIFrameworkRegistry.register(adapter)
        NHAIFrameworkRegistry.use('vanilla')

        let startMemory = null;
        let endMemory = null;

        function updateProgress(percent) {
            const progressBar = document.getElementById('progress');
            progressBar.style.width = percent + '%';
            progressBar.textContent = Math.round(percent) + '%';
        }

        function updateStatus(message, type = 'running') {
            const statusEl = document.getElementById('status');
            const badgeClass = type === 'running' ? 'status-running' : 
                              type === 'completed' ? 'status-completed' : 'status-error';
            statusEl.innerHTML = `<span class="status-badge ${badgeClass}">${message}</span>`;
        }

        function updateMemory() {
            if (performance.memory) {
                startMemory = performance.memory.usedJSHeapSize;
            }
        }

        function getMemoryInfo() {
            if (performance.memory) {
                const memory = performance.memory;
                endMemory = memory.usedJSHeapSize;
                const usedMB = ((endMemory - (startMemory || 0)) / 1048576).toFixed(2);
                const totalMB = (memory.totalJSHeapSize / 1048576).toFixed(2);
                const limitMB = (memory.jsHeapSizeLimit / 1048576).toFixed(2);
                
                return {
                    used: usedMB,
                    total: totalMB,
                    limit: limitMB
                };
            }
            return null;
        }

        function countDOMNodes() {
            const container = document.getElementById('buttonsContainer');
            let count = 0;
            
            function walk(node) {
                count++;
                for (let i = 0; i < node.childNodes.length; i++) {
                    walk(node.childNodes[i]);
                }
            }
            
            walk(container);
            return count;
        }

        window.runTest = async function() {
            const container = document.getElementById('buttonsContainer');
            const count = 10000;
            
            updateStatus('正在创建按钮...', 'running');
            updateProgress(0);
            
            // 记录初始内存
            updateMemory();
            
            const startTime = performance.now();
            
            // 使用文档碎片批量添加节点
            const fragment = document.createDocumentFragment();
            
            let progress = 0;
            for (let i = 0; i < count; i++) {
                const btn = new MaterialButton(`按钮${i + 1}`);
                
                // 设置不同的样式
                const typeIndex = i % 7;
                switch(typeIndex) {
                    case 0:
                        btn.setType(ButtonType.BASIC);
                        btn.setColor(ButtonColor.BLUE);
                        break;
                    case 1:
                        btn.setType(ButtonType.BASIC);
                        btn.setColor(ButtonColor.GREEN);
                        break;
                    case 2:
                        btn.setType(ButtonType.BASIC);
                        btn.setColor(ButtonColor.RED);
                        break;
                    case 3:
                        btn.setType(ButtonType.BASIC);
                        btn.setColor(ButtonColor.ORANGE);
                        break;
                    case 4:
                        btn.setVariant('raised');
                        btn.setColor(ButtonColor.BLUE);
                        break;
                    case 5:
                        btn.setVariant('flat');
                        btn.setColor(ButtonColor.GREEN);
                        break;
                    case 6:
                        btn.setVariant('floating');
                        btn.setColor(ButtonColor.RED);
                        break;
                }
                
                btn.setSize(i % 3 === 0 ? ButtonSize.LARGE : 
                           i % 3 === 1 ? ButtonSize.MEDIUM : ButtonSize.SMALL);
                
                const element = btn.render();
                const div = document.createElement('div');
                div.className = 'button-item';
                div.appendChild(element);
                fragment.appendChild(div);
                
                // 更新进度
                if (i % 100 === 0 || i === count - 1) {
                    progress = ((i + 1) / count) * 100;
                    updateProgress(progress);
                    
                    if (i % 1000 === 0) {
                        await new Promise(resolve => setTimeout(resolve, 0));
                    }
                }
            }
            
            // 一次性添加到DOM
            container.innerHTML = '';
            container.appendChild(fragment);
            
            const endTime = performance.now();
            const renderTime = endTime - startTime;
            
            // 更新统计信息
            document.getElementById('renderTime').textContent = `${renderTime.toFixed(2)} ms`;
            document.getElementById('buttonCount').textContent = count.toLocaleString();
            document.getElementById('domNodes').textContent = countDOMNodes().toLocaleString();
            
            // 测试内存
            setTimeout(() => {
                const memInfo = getMemoryInfo();
                if (memInfo) {
                    document.getElementById('memory').textContent = `${memInfo.used} MB`;
                    
                    // 显示内存详情
                    document.getElementById('resultsTable').innerHTML = `
                        <table class="comparison-table">
                            <thead>
                                <tr>
                                    <th>指标</th>
                                    <th>数值</th>
                                    <th>评价</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><strong>渲染时间</strong></td>
                                    <td class="metric-${renderTime < 1000 ? 'good' : renderTime < 3000 ? 'medium' : 'bad'}">${renderTime.toFixed(2)} ms</td>
                                    <td>${renderTime < 1000 ? '优秀' : renderTime < 3000 ? '良好' : '需要优化'}</td>
                                </tr>
                                <tr>
                                    <td><strong>DOM 节点数</strong></td>
                                    <td class="metric-${parseInt(document.getElementById('domNodes').textContent.replace(',', '')) < 20000 ? 'good' : 'medium'}">${document.getElementById('domNodes').textContent} 个</td>
                                    <td>每个按钮约 ${Math.round(parseInt(document.getElementById('domNodes').textContent.replace(',', '')) / count)} 个节点</td>
                                </tr>
                                <tr>
                                    <td><strong>内存增长</strong></td>
                                    <td class="metric-${parseFloat(memInfo.used) < 20 ? 'good' : 'medium'}">${memInfo.used} MB</td>
                                    <td>${parseFloat(memInfo.used) < 20 ? '良好' : '偏高'}</td>
                                </tr>
                                <tr>
                                    <td><strong>总内存</strong></td>
                                    <td>${memInfo.total} MB / ${memInfo.limit} MB</td>
                                    <td>-</td>
                                </tr>
                            </tbody>
                        </table>
                    `;
                }
            }, 1000);
            
            updateProgress(100);
            updateStatus('测试完成！', 'completed');
        };

        window.clearResults = function() {
            document.getElementById('buttonsContainer').innerHTML = '';
            document.getElementById('renderTime').textContent = '-';
            document.getElementById('buttonCount').textContent = '0';
            document.getElementById('domNodes').textContent = '0';
            document.getElementById('memory').textContent = '-';
            document.getElementById('resultsTable').innerHTML = '';
            updateProgress(0);
            updateStatus('');
        };

        window.runLightweightComparison = function() {
            alert('正在跳转到轻量级按钮对比测试...');
            // 这里可以跳转到对比页面或显示对比信息
            document.getElementById('resultsTable').innerHTML = `
                <div class="info-box">
                    <h3>✨ 轻量级按钮优化方案</h3>
                    <p>MaterialButton 已经是轻量级实现，因为：</p>
                    <ul style="margin: 10px 0 0 20px; color: #856404;">
                        <li>✅ 使用原生 DOM 创建按钮</li>
                        <li>✅ 应用 Materialize CSS 样式类</li>
                        <li>✅ 无需 Vue 框架开销</li>
                        <li>✅ 每个按钮只生成必要的 DOM 节点</li>
                    </ul>
                    <p style="margin-top: 10px;"><strong>优势：</strong>性能接近原生 DOM，同时保持 Material Design 美观外观</p>
                </div>
            `;
        };

        // 页面加载完成
        window.addEventListener('load', function() {
            console.log('✓ Vanilla Adapter 已注册');
            updateStatus('✓ 适配器已注册，等待开始测试...', 'completed');
        });
    </script>
</body>
</html>
