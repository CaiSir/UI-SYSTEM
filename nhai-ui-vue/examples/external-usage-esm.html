<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ES Module 方式使用示例</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
    }
    
    .demo-section {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .demo-section h2 {
      margin-top: 0;
      color: #1890ff;
    }
    
    .demo-container {
      margin-top: 16px;
      padding: 16px;
      background: #fafafa;
      border-radius: 4px;
    }
  </style>
  <!-- 引入 Element Plus 样式 -->
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <!-- 引入 NHAI UI Vue 样式（构建后） -->
  <!-- <link rel="stylesheet" href="../dist/index.css"> -->
</head>
<body>
  <h1>NHAI UI Vue - ES Module 使用示例</h1>
  <p>这个示例演示如何使用 ES Module 方式导入和使用组件（不需要绑定到 window）</p>
  
  <div class="demo-section">
    <h2>示例 1: 基础按钮</h2>
    <div class="demo-container" id="demo1"></div>
  </div>
  
  <div class="demo-section">
    <h2>示例 2: Row/Col 布局</h2>
    <div class="demo-container" id="demo2"></div>
  </div>
  
  <div class="demo-section">
    <h2>示例 3: 表单布局</h2>
    <div class="demo-container" id="demo3"></div>
  </div>

  <!-- 引入 Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  
  <script type="module">
    // ES Module 方式导入（推荐方式）
    // 注意：需要先构建项目 (npm run build)
    // 然后取消下面的注释，并注释掉模拟导入部分
    
    // 实际使用时的导入方式：
    // import { 
    //   NhaiButtonCommand,
    //   NhaiInputCommand,
    //   NhaiRowCommand,
    //   NhaiColCommand,
    //   NhaiSelectCommand
    // } from '../dist/index.es.js'
    
    // 模拟导入（用于演示，实际使用时请使用上面的方式）
    // 这里假设组件已经通过其他方式加载（比如通过构建工具）
    const { 
      NhaiButtonCommand,
      NhaiInputCommand,
      NhaiRowCommand,
      NhaiColCommand,
      NhaiSelectCommand
    } = window.NHAIUIVue || {}
    
    // 示例 1: 基础按钮
    if (NhaiButtonCommand) {
      const btn1 = new NhaiButtonCommand('主要按钮')
      btn1.setType('primary')
      btn1.setOnClick(() => alert('按钮被点击了！'))
      
      const btn2 = new NhaiButtonCommand('成功按钮')
      btn2.setType('success')
      
      const btn3 = new NhaiButtonCommand('警告按钮')
      btn3.setType('warning')
      
      const container1 = document.getElementById('demo1')
      container1.appendChild(btn1.render())
      container1.appendChild(btn2.render())
      container1.appendChild(btn3.render())
    }
    
    // 示例 2: Row/Col 布局
    if (NhaiRowCommand && NhaiColCommand && NhaiButtonCommand) {
      const row = new NhaiRowCommand()
      row.setGutter(16)
      
      const col1 = new NhaiColCommand({ span: 6 })
      const col2 = new NhaiColCommand({ span: 6 })
      const col3 = new NhaiColCommand({ span: 6 })
      const col4 = new NhaiColCommand({ span: 6 })
      
      const btn1 = new NhaiButtonCommand('列 1')
      btn1.setType('primary')
      btn1.setStyle({ width: '100%' })
      col1.addChild(btn1)
      
      const btn2 = new NhaiButtonCommand('列 2')
      btn2.setType('success')
      btn2.setStyle({ width: '100%' })
      col2.addChild(btn2)
      
      const btn3 = new NhaiButtonCommand('列 3')
      btn3.setType('warning')
      btn3.setStyle({ width: '100%' })
      col3.addChild(btn3)
      
      const btn4 = new NhaiButtonCommand('列 4')
      btn4.setType('danger')
      btn4.setStyle({ width: '100%' })
      col4.addChild(btn4)
      
      row.addChild(col1)
      row.addChild(col2)
      row.addChild(col3)
      row.addChild(col4)
      
      const container2 = document.getElementById('demo2')
      container2.appendChild(row.render())
    }
    
    // 示例 3: 表单布局
    if (NhaiRowCommand && NhaiColCommand && NhaiInputCommand && NhaiSelectCommand) {
      const formRow = new NhaiRowCommand()
      formRow.setGutter([16, 16])
      
      // 标签列
      const labelCol = new NhaiColCommand({ span: 4 })
      const labelDiv = document.createElement('div')
      labelDiv.textContent = '用户名：'
      labelDiv.style.padding = '8px'
      labelDiv.style.lineHeight = '32px'
      labelCol.getElement().appendChild(labelDiv)
      
      // 输入框列
      const inputCol = new NhaiColCommand({ span: 20 })
      const input = new NhaiInputCommand()
      input.setPlaceholder('请输入用户名')
      inputCol.addChild(input)
      
      formRow.addChild(labelCol)
      formRow.addChild(inputCol)
      
      const container3 = document.getElementById('demo3')
      container3.appendChild(formRow.render())
    }
    
    console.log('✅ ES Module 方式使用示例加载完成')
    console.log('📝 实际使用时，请取消注释 import 语句，并确保已构建项目')
  </script>
</body>
</html>
