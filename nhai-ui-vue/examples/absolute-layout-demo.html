<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>绝对定位布局示例</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    h1 {
      margin-bottom: 20px;
    }
    
    #demo {
      border: 2px solid #ccc;
      border-radius: 8px;
      min-height: 400px;
    }
  </style>
</head>
<body>
  <h1>绝对定位布局示例</h1>
  <p>这个示例演示如何使用 AbsolutePanel 实现自由布局</p>
  <div id="demo"></div>

  <script type="module">
    import { 
      AbsolutePanelCommand,
      ButtonCommand
    } from '../src/components/index.js'
    
    // 创建绝对定位面板
    const panel = new AbsolutePanelCommand('100%', '400px')
    panel.setBackgroundColor('#f5f5f5')
    
    // 在不同位置添加按钮
    const btn1 = new ButtonCommand('按钮1')
    btn1.setType('primary')
    panel.addWidgetAt('btn1', btn1, { x: 20, y: 20 })
    
    const btn2 = new ButtonCommand('按钮2')
    btn2.setType('success')
    panel.addWidgetAt('btn2', btn2, { x: 120, y: 20 })
    
    const btn3 = new ButtonCommand('按钮3')
    btn3.setType('warning')
    panel.addWidgetAt('btn3', btn3, { x: 220, y: 100 })
    
    const btn4 = new ButtonCommand('按钮4')
    btn4.setType('danger')
    panel.addWidgetAt('btn4', btn4, { x: 320, y: 180 })
    
    // 渲染
    document.getElementById('demo')?.appendChild(panel.render())
    
    // 演示动态更新位置
    setTimeout(() => {
      panel.setPosition('btn1', 50, 50)
      console.log('按钮1的新位置:', panel.getPosition('btn1'))
    }, 2000)
  </script>
</body>
</html>
