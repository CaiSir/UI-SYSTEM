<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHAI UI Vue - 性能测试 - 10000个按钮（内联版本）</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }

        .test-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .controls {
            margin-bottom: 20px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .controls button {
            margin: 5px;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .controls button:hover {
            background: #1565c0;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            padding: 15px;
            background: #e3f2fd;
            border-radius: 8px;
            min-width: 150px;
        }

        .stat-item h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #666;
        }

        .stat-item .value {
            font-size: 24px;
            font-weight: bold;
            color: #1976d2;
        }

        .buttons-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            max-height: 600px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .button-item {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 8px;
            text-align: center;
        }

        .memory-info {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
        }

        .test-btn {
            background: #1976d2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .test-btn:hover {
            background: #1565c0;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>NHAI UI Vue - 性能测试</h1>
        <h2>测试场景：渲染 10000 个按钮</h2>

        <div class="controls">
            <h3>控制面板</h3>
            <button class="test-btn" onclick="runTest()">运行测试</button>
            <button class="test-btn" onclick="clearResults()">清除结果</button>
            <button class="test-btn" onclick="testMemory()">检查内存</button>
        </div>

        <div class="stats" id="stats">
            <div class="stat-item">
                <h3>渲染时间</h3>
                <div class="value" id="renderTime">-</div>
            </div>
            <div class="stat-item">
                <h3>按钮数量</h3>
                <div class="value" id="buttonCount">0</div>
            </div>
            <div class="stat-item">
                <h3>DOM节点数</h3>
                <div class="value" id="domNodes">0</div>
            </div>
            <div class="stat-item">
                <h3>内存占用</h3>
                <div class="value" id="memory">-</div>
            </div>
        </div>

        <div class="buttons-container" id="buttonsContainer"></div>

        <div class="memory-info" id="memoryInfo"></div>
    </div>

    <script>
        let testResults = [];

        window.runTest = function() {
            const container = document.getElementById('buttonsContainer');
            const startTime = performance.now();
            
            console.log('开始创建按钮...');
            console.time('Button Creation');
            
            // 清空容器
            container.innerHTML = '';
            
            // 使用文档碎片批量添加节点（提高性能）
            const fragment = document.createDocumentFragment();
            
            // 创建10000个按钮
            for (let i = 0; i < 10000; i++) {
                const div = document.createElement('div');
                div.className = 'button-item';
                
                const btn = document.createElement('button');
                btn.className = `test-btn type-${i % 5}`;
                btn.textContent = `按钮${i + 1}`;
                btn.style.background = i % 5 === 0 ? '#1976d2' : 
                                      i % 5 === 1 ? '#4caf50' : 
                                      i % 5 === 2 ? '#ff9800' : 
                                      i % 5 === 3 ? '#f44336' : '#9e9e9e';
                
                div.appendChild(btn);
                fragment.appendChild(div);
            }
            
            // 一次性添加到DOM
            container.appendChild(fragment);
            
            const endTime = performance.now();
            const renderTime = endTime - startTime;
            
            console.timeEnd('Button Creation');
            
            // 更新统计信息
            document.getElementById('renderTime').textContent = `${renderTime.toFixed(2)} ms`;
            document.getElementById('buttonCount').textContent = '10000';
            document.getElementById('domNodes').textContent = countDOMNodes();
            
            // 测试内存
            setTimeout(() => {
                testMemory();
            }, 100);
            
            console.log(`渲染完成，耗时：${renderTime.toFixed(2)}ms`);
        };

        function countDOMNodes() {
            const container = document.getElementById('buttonsContainer');
            let count = 0;
            
            function walk(node) {
                count++;
                for (let i = 0; i < node.childNodes.length; i++) {
                    walk(node.childNodes[i]);
                }
            }
            
            walk(container);
            return count.toLocaleString();
        }

        window.clearResults = function() {
            document.getElementById('buttonsContainer').innerHTML = '';
            document.getElementById('renderTime').textContent = '-';
            document.getElementById('buttonCount').textContent = '0';
            document.getElementById('domNodes').textContent = '0';
            document.getElementById('memory').textContent = '-';
            document.getElementById('memoryInfo').textContent = '';
        };

        window.testMemory = function() {
            if (performance.memory) {
                const memory = performance.memory;
                const usedMB = (memory.usedJSHeapSize / 1048576).toFixed(2);
                const totalMB = (memory.totalJSHeapSize / 1048576).toFixed(2);
                const limitMB = (memory.jsHeapSizeLimit / 1048576).toFixed(2);
                
                document.getElementById('memory').textContent = `${usedMB} MB`;
                
                document.getElementById('memoryInfo').innerHTML = `
                    <h3>内存详情</h3>
                    <p>已使用堆内存：${usedMB} MB</p>
                    <p>总分配堆内存：${totalMB} MB</p>
                    <p>堆内存限制：${limitMB} MB</p>
                `;
            } else {
                document.getElementById('memoryInfo').innerHTML = `
                    <h3>⚠️ 浏览器兼容性</h3>
                    <p>您的浏览器不支持 performance.memory API</p>
                    <p>请使用 Chrome/Edge 浏览器打开此页面查看完整的内存信息</p>
                `;
            }
        };

        // 页面加载完成后显示提示
        window.addEventListener('load', function() {
            console.log('性能测试工具准备就绪');
            console.log('点击"运行测试"按钮开始测试 10000 个按钮的渲染性能');
            console.log('建议使用 Chrome DevTools 的 Performance 面板监控详细性能数据');
        });
    </script>
</body>
</html>
